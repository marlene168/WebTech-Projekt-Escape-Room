<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escape Room – Raumauswahl</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/start.js"></script>
</head>
<body class="startseite">
  <header class="start-kopf">
    <h1 class="start-titel">Escape Room</h1>
    <p class="start-untertitel">Wähle einen Raum. Jeder Raum ist ein eigenes Abenteuer – je weiter unten, desto kniffliger.</p>

    <!-- Beitritt zu einer Sitzung, die jemand anderes erstellt hat (nur vor dem Spielstart möglich) -->
    <form class="beitreten">
      <label for="beitrittscode">Code von deiner Gruppe:</label>
      <input id="beitrittscode" name="code" autocomplete="off" spellcheck="false" maxlength="6" placeholder="z. B. K7XQ2M" required>
      <button class="knopf knopf-haupt">Beitreten</button>
    </form>
    <p class="start-meldung" role="alert" hidden></p>
    <!-- Sicherheitsprüfung (Cloudflare Turnstile) – erscheint nur online bei einer neuen Gastanmeldung -->
    <div class="captcha" hidden>
      <p>Kurze Sicherheitsprüfung, bevor es losgeht …</p>
      <div class="captcha-widget"></div>
    </div>
  </header>

  <!-- Die Raumkarten werden von js/start.js aus shared/raeume/index.js erzeugt.
       "Spielen" erstellt eine neue Sitzung – allein oder zum Teilen des Codes mit bis zu drei weiteren Personen. -->
  <main class="raum-liste"></main>
</body>
</html>
